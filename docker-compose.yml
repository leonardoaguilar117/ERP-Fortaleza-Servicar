# Versión de prueba del prototipo (sin backend).
#   docker compose up --build    →    http://localhost:8080
# En la fase 1 se agregan aquí postgres, minio, mailpit, api, web y portal (docs/especificacion.md §4.3).
services:
  prototipo:
    build:
      context: .
      dockerfile: docker/prototipo.Dockerfile
    image: fortaleza-servicar/prototipo:prueba
    container_name: fortaleza-prototipo
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # la imagen de Caddy la declara en su binario; sin ella el contenedor no arranca
